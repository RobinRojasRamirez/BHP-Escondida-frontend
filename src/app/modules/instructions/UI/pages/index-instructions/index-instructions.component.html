<div class="card">
    <div class="grid flex flex-wrap align-items-center">
      <div class="col-12 lg:col-6 md:col-6">
        <h4 class="m-0">
          <i class="pi pi-bars px-2 fa-1x mr-2"></i>
          Lista de instructivos
        </h4>
      </div>
      <div class="col-12 col-12 lg:col-6 md:col-6">
        <div class="flex flex-row flex-wrap card-container blue-container align-items-center justify-content-end">
          <p-button 
            [outlined]="true"
            styleClass="w-15rem" 
            [rounded]="true"
            severity="secondary"
            icon="pi pi-plus-circle" 
            label="Crear"
            type="button"
            (click)="showModal()"
          ></p-button>
        </div>
      </div>
    </div>
    <div class="grid mt-3">
      <div class="col-12">
        <p-table
          #dt1
          styleClass="p-datatable-striped"
          [value]="listsInstruction"
          [lazy]="true"
          responsiveLayout="scroll"
          dataKey="id"
          [loading]="loadingTable"
          [rows]="rowSize"
          [tableStyle]="{ 'min-width': '75rem' }"
          [totalRecords]="totalRecords"
          [paginator]="true"
          [rowsPerPageOptions]="[10, 25, 50, 100]"
          [showCurrentPageReport]="true"
          (onLazyLoad)="loadTable($event)"
          currentPageReportTemplate="Mostrando del {first} al {last} de {totalRecords} entradas"
        >
          <ng-template pTemplate="caption">
            <div class="grid card-container blue-container">
              <div class="flex w-30rem ml-auto p-0 mt-2 sm:mt-0">
                <span class="p-input-icon-left w-full">
                  <input
                    pInputText
                    type="text"
                    class="w-full"
                    (input)="dt1.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Buscar un registro"
                  />
                </span>
              </div>
            </div>
          </ng-template>
          <ng-template pTemplate="header">
              <tr>
                <ng-container *ngFor="let col of cols">
                  <th *ngIf="col.order"
                      [class]="col.nameClass"
                      [style.minWidth]="col.minWidth"
                      pSortableColumn="{{ col.field }}"
                      class="p-2">
                      <div class="flex items-center w-full justify-between">
                        <div
                          class="w-full"
                        >
                          <span>{{ col.header }}</span>
                        </div>
                        <p-sortIcon [field]="col.field"></p-sortIcon>
                      </div>        
                  </th>
                  <th *ngIf="!col.order"
                      [class]="col.nameClass"
                      [style.minWidth]="col.minWidth"
                      class="p-2">
                    <span>{{ col.header }}</span>
                  </th>
                </ng-container>
              </tr>
          </ng-template>
          <ng-template pTemplate="body" let-item>
            <tr>
              <td *ngFor="let col of cols" [class]="col.nameClass" [style.minWidth]="col.minWidth">
                <span *ngIf="col.type === 'string'">
                  {{ item[col.field] }}
                </span>
                <span *ngIf="col.type === 'number'">
                  {{ item[col.field] }}
                </span>
                  <span *ngIf="col.type === 'date'">
                  {{ item[col.field] | date: 'dd/MM/yyyy hh:mm:ss' }}
                </span>
                <span *ngIf="col.type === 'tag-1'">
                  <p-tag
                    [value]="item[col.field] == true ? 'Activo' : 'Inactivo'"
                    [severity]="getSeverity(item[col.field])">
                  </p-tag>
                </span>
                <span *ngIf="col.type === 'actions'">
                  <p-menu #menu 
                          [model]="menuItems" 
                          [popup]="true" 
                          [appendTo]="'body'">
                  </p-menu>
                  <button pButton
                          type="button"
                          icon="pi pi-ellipsis-v"
                          class="p-button-rounded p-button-outlined p-button-primary"
                          (click)="openMenu($event, menu, item.id)">
                  </button>
                </span>
              </td>
            </tr>
          </ng-template>
          <ng-template pTemplate="emptymessage">
            <tr >
              <td colspan="7" class="text-center p-3">No se encontraron registros.</td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
  </div>
