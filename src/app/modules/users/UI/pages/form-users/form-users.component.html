<p-toast position="top-right"></p-toast>
<p-dialog
  (onHide)="hideModal()"
  [(visible)]="displayModal"
  [modal]="true"
  [style]="{ width: '35vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <div *ngIf="loading" class="flex justify-content-center">
    <p-progressSpinner  ariaLabel="Loading"></p-progressSpinner>
  </div>
  <ng-template pTemplate="header">
    <h4 class="m-0">{{ title }}</h4>
  </ng-template>
  <ng-template pTemplate="content">
    <div class="grid" *ngIf="!loading">
      
      <div class="col-12">
        <hr class="m-0" />
      </div>

      <div *ngIf="isLoading" class="col-12 flex justify-content-center align-items-center">
        <p-progressSpinner ariaLabel="isLoading"></p-progressSpinner>
      </div>

      <!-- Form -->
      <form
        name="frmUsers"
        id="frmUsers"
        class="col-12 sm:col-12 md:col-12 lg:col-12"
        [formGroup]="frmUsers"
        (ngSubmit)="onSubmit()"
      >
      <ng-container *ngIf="!isLoading">
        <div class="col-12 sm:col-12 md:col-12 lg:col-12">
          <div class="formgrid grid m-0">

            <div class="grid col-12 md:col-12">
              <div class="col-12 sm:col-12 md:col-12 lg:col-12 p-0">
                <div class="field form-group grid align-items-center">
                  <div class="field col-12 sm:col-12 md:col-2 lg:col-2">
                    <span class="block mb-2">Activo</span>
                    <p-toggleswitch styleClass="mt-1" formControlName="active"></p-toggleswitch>
                  </div> 
                  <div class="field col-12 sm:col-12 md:col-10 lg:col-10">
                    <span class="block mb-2">Nombre</span>
                    <input class="w-full" id="name" type="text" pInputText formControlName="name" placeholder="Nombre" />
                    <small *ngIf="frmUsers.get('name')?.invalid && frmUsers.get('name')?.touched" class="p-error text-red-500 block">
                      Nombre es requerido.
                    </small>
                  </div> 
                </div>
              </div>
            </div>

            <div class="grid col-12 md:col-12">
              <div class="col-12 sm:col-12 md:col-12 lg:col-12 p-0">
                <div class="field form-group grid align-items-center">
                  <div class="field col-12 sm:col-12 md:col-12 lg:col-12">
                    <span class="block mb-2">Correo electrónico</span>
                    <input class="w-full" id="email" type="text" pInputText formControlName="email" placeholder="Correo electrónico" />
                    <small *ngIf="frmUsers.get('email')?.invalid && frmUsers.get('email')?.touched" class="p-error text-red-500 block">
                      Correo electrónico es requerido.
                    </small>
                  </div> 
                </div>
              </div>
            </div>

            <div class="grid col-12 md:col-12">
              <div class="col-12 sm:col-12 md:col-12 lg:col-12 p-0">
                <div class="field form-group grid align-items-center">
                  <div class="field col-12 sm:col-12 md:col-12 lg:col-12">
                    <span class="block mb-2">Roles</span>
                    <p-multiSelect
                      id="roles"
                      name="roles"
                      [options]="listsRoles"
                      formControlName="roles"
                      optionLabel="name"
                      optionValue="id"
                      placeholder="Seleccione uno o más roles"
                      class="w-full"
                      display="chip"
                      [showToggleAll]="false"
                    ></p-multiSelect>
                    <small *ngIf="frmUsers.get('rol')?.invalid && frmUsers.get('rol')?.touched" class="p-error text-red-500 block">
                      Rol es requerido.
                    </small>
                  </div>
                </div>
              </div>
            </div>

            <div class="grid col-12 md:col-12">
              <div class="col-12 p-0">
                <div class="field form-group grid align-items-center">
                  <div class="field col-12">
                    <span class="block mb-2">Contraseña</span>
                    <p-inputgroup class="w-full">
                      <input
                        [type]="showPassword ? 'password' : 'text'"
                        id="password"
                        pInputText
                        formControlName="password"
                        placeholder="Contraseña"
                        class="w-full"
                      />
                      <p-inputgroup-addon (click)="togglePasswordVisibility()" class="cursor-pointer">
                        <i class="{{ showPassword ? 'pi pi-eye-slash' : 'pi pi-eye' }}"></i>
                      </p-inputgroup-addon>
                    </p-inputgroup>
                    <small
                      *ngIf="frmUsers.get('password')?.invalid && frmUsers.get('password')?.touched"
                      class="p-error text-red-500 block"
                    >
                      Contraseña es requerida.
                    </small>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12">
          <hr class="-mt-3" />
        </div>
        
      </ng-container>
        <div class="grid col-12 p-0 justify-content-end">
          <div class="col-12 sm:col-12 md:col-4 lg:col-4">
            <button
              styleClass="button-cancel"
              pButton
              class="p-button-rounded w-full p-button-danger p-button-outlined p-mb-1"
              type="button"
              (click)="hideModal()"
              icon="pi pi-replay"
              label="Cancelar"
            ></button>
          </div>
          <div class="col-12 sm:col-12 md:col-4 lg:col-4">
            <button
              styleClass="button-save"
              pButton
              [disabled]="loading"
              class="p-button-rounded w-full p-button-success p-button-outlined p-mb-1"
              type="submit"
              icon="pi pi-save"
              label="Guardar"
            ></button>
          </div>
      </div>
      </form>
    </div>
  </ng-template>
  <ng-template pTemplate="footer"> </ng-template>
</p-dialog>
